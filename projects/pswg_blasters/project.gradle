loom {
	splitEnvironmentSourceSets()

	mods {
		"pswg_blasters" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		modId = "pswg_blasters"
		client = true
	}
}

dependencies {
	api(project(":projects:pswg_core"))
	compileOnly(project(path: ":projects:framework"))
	annotationProcessor(project(path: ":projects:framework-generator"))
}
